spring.application.name=moon

#INFO, DEBUG
logging.console.enabled=true
logging.level.root=INFO 
logging.level.org.springframework=INFO
logging.level.com.moon=INFO
logging.level.org.springframework.security: INFO
logging.level.org.hibernate=INFO
#logging.level.org.hibernate.SQL=DEBUG
#logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.com.zaxxer.hikari=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# Configuración de puerto del servidor
server.port=8080

# Configuración de la base de datos
spring.datasource.url=jdbc:mysql://pagoencombo.com:3306/pagoenco_database?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=pagoenco_root
spring.datasource.password=admin123456789admin

# Driver y Dialecto
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# Estrategia de creación de tablas (usa 'update' para desarrollo)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# Configuración de JPA (Hibernate)
#spring.jpa.hibernate.ddl-auto=update  # O 'create', 'create-drop' dependiendo de tu necesidad
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Opcional: Para evitar los loggings de consultas SQL en consola
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Configuración de conexión (opcional)
#spring.datasource.hikari.maximum-pool-size=10  # Tamaño del pool de conexiones

# Desactivar el uso de Gradle Daemon
org.gradle.daemon=false

# Limitar el uso de memoria para los Daemons
org.gradle.jvmargs=-Xmx1024m

google.api.key=${GOOGLE_API_KEY}